name: Test UI build and module validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Python scripts, JSON schemas, and Robot Framework syntax
        run: |
          python3 -m pip install --quiet robotframework robotframework-sshlibrary
          python3 - <<'EOF'
          import json
          import os
          import subprocess

          for rel in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              if not os.path.isfile(rel):
                  continue
              if rel.endswith(".json") and not rel.startswith(".devcontainer"):
                  with open(rel, encoding="utf-8") as fp:
                      json.load(fp)
              elif rel.startswith("imageroot/"):
                  with open(rel, "rb") as fp:
                      first_line = fp.readline()
                  if b"python" in first_line:
                      subprocess.run(["python3", "-m", "py_compile", rel], check=True)
          EOF
          robot --dryrun tests/

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "ui/yarn.lock"

      - name: Check Node Version
        run: node --version
        working-directory: ./ui

      - name: Check Yarn Version
        run: yarn --version
        working-directory: ./ui

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ./ui

      - name: Build application
        run: yarn build
        working-directory: ./ui
